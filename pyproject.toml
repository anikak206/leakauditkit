[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakauditkit"
version = "0.1.0"
description = "Audit ML/LLM evaluation pipelines for data leakage and shortcut learning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anika" }]
keywords = ["data-leakage", "evaluation", "llm", "ml", "audit", "contamination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.5",
  "rich>=13.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.7", "numpy>=1.26"]
hf = ["datasets>=2.18"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
leakaudit = "leakauditkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with -m 'not slow')",
  "requires_semantic: needs sentence-transformers",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true